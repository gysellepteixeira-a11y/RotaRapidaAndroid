name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Aplicar correcao v0.7 da imagem
        run: python3 scripts/patch_v07.py

      - name: Aplicar correcao v0.8 download e OCR
        run: python3 scripts/patch_v08.py

      - name: Aplicar correcao v0.9 estabilidade real
        run: python3 scripts/patch_v09.py

      - name: Aplicar correcao v0.10 abertura confiavel
        run: python3 scripts/patch_v10.py

      - name: Aplicar correcao v0.11 linha exata da gaiola
        run: python3 scripts/patch_v11.py

      - name: Aplicar correcao v0.12 reconstruir linhas OCR
        run: python3 scripts/patch_v12.py

      - name: Aplicar correcao v0.13 zoom real tabela densa
        run: python3 scripts/patch_v13.py

      - name: Aplicar teste v0.14 MediaStore sem abrir imagem
        run: python3 scripts/patch_v14.py

      - name: Aplicar v0.15 somente arquivos e envio robusto
        run: python3 scripts/patch_v15.py

      - name: Aplicar v0.16 prioridade estrita e envio confirmado
        run: python3 scripts/patch_v16.py

      - name: Aplicar v0.17 velocidade experimental
        run: python3 scripts/patch_v17.py

      - name: Aplicar v0.18 crop por cor em tabelas grandes
        run: python3 scripts/patch_v18.py

      - name: Aplicar v0.19 tabela densa de pouca altura
        run: python3 scripts/patch_v19.py

      - name: Corrigir compilacao da v0.19
        run: python3 scripts/patch_v20.py

      - name: Aplicar v0.21 OCR compacto Gaiola+Bairro
        run: python3 scripts/patch_v21.py

      - name: Preparar matcher de prioridade da v0.22
        run: python3 scripts/patch_v22_pre.py

      - name: Aplicar v0.22 grid-first Bairro depois Gaiola
        run: python3 scripts/patch_v22.py

      - name: Aplicar v0.23 bairros normalizados por linha
        run: python3 scripts/patch_v23.py

      - name: Aplicar v0.24 leitura em paineis e prioridades reduzidas
        run: python3 scripts/patch_v24.py

      - name: Aplicar v0.25 hibrida para tabelas densas
        run: python3 scripts/patch_v25.py

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RotaRapida-APK-v0.25-HIBRIDA-DENSA
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
