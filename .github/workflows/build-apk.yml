name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Aplicar correcao v0.7 da imagem
        run: python3 scripts/patch_v07.py

      - name: Aplicar correcao v0.8 download e OCR
        run: python3 scripts/patch_v08.py

      - name: Aplicar correcao v0.9 estabilidade real
        run: python3 scripts/patch_v09.py

      - name: Aplicar correcao v0.10 abertura confiavel
        run: python3 scripts/patch_v10.py

      - name: Aplicar correcao v0.11 linha exata da gaiola
        run: python3 scripts/patch_v11.py

      - name: Aplicar correcao v0.12 reconstruir linhas OCR
        run: python3 scripts/patch_v12.py

      - name: Aplicar correcao v0.13 zoom real tabela densa
        run: python3 scripts/patch_v13.py

      - name: Aplicar teste v0.14 MediaStore sem abrir imagem
        run: python3 scripts/patch_v14.py

      - name: Aplicar v0.15 somente arquivos e envio robusto
        run: python3 scripts/patch_v15.py

      - name: Aplicar v0.16 prioridade estrita e envio confirmado
        run: python3 scripts/patch_v16.py

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RotaRapida-APK-v0.16-PRIORIDADE-ENVIO
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
