name: Gerar APK TEXT v27 PRE CLICK DIAG

on:
  push:
    branches:
      - test-v27-preclick-diag
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Reproduzir base TEXT v18 + IMAGE v9
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          p=Path('.github/workflows/build-text-read-more-expanded-v16.yml')
          text=p.read_text(encoding='utf-8')
          scripts=re.findall(r'run:\s+python3\s+(scripts/[^\s]+\.py)', text)
          if not scripts:
              raise SystemExit('Nenhum patch da base v18 encontrado')
          if scripts[-1] != 'scripts/patch_v19_text_read_more_strict_v18.py':
              raise SystemExit('Base v18 inesperada: ultimo patch='+scripts[-1])
          for script in scripts:
              print('>>>', script, flush=True)
              subprocess.run(['python3', script], check=True)
          print('Base v18 reproduzida com', len(scripts), 'patches')
          PY

      - name: Esperar no real Ler mais sem gestos v20
        run: python3 scripts/patch_v19_text_read_more_desc_wait_v20.py

      - name: Invalidar callbacks antigos do DESC WAIT v21
        run: python3 scripts/patch_v19_text_read_more_desc_wait_token_v21.py

      - name: Medir atraso do Handler v22
        run: python3 scripts/patch_v19_text_schedule_diag_v22.py

      - name: Medir custo da prova do Ler mais v23
        run: python3 scripts/patch_v19_text_read_more_proof_diag_v23.py

      - name: Pular prova imediata e usar primeira prova apos 6ms v24
        run: python3 scripts/patch_v19_text_read_more_skip_immediate_proof_v24.py

      - name: Medir trecho pos-proof ate rota v25
        run: python3 scripts/patch_v19_text_post_proof_diag_v25.py

      - name: Parse direto do texto ja validado pelo strict proof v26
        run: python3 scripts/patch_v19_text_proof_direct_parse_v26.py

      - name: Medir trecho pre-clique do Ler mais v27
        run: python3 scripts/patch_v19_text_preclick_diag_v27.py

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RotaRapida-APK-v0.19-TEXT-v27-PRE-CLICK-DIAG-v26-v24-v21-IMAGE-v9
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
