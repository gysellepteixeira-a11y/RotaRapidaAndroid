name: Gerar APK TEXT v20 READ MORE DESC WAIT

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Reproduzir base TEXT v18 + IMAGE v9
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          p=Path('.github/workflows/build-text-read-more-expanded-v16.yml')
          text=p.read_text(encoding='utf-8')
          scripts=re.findall(r'run:\s+python3\s+(scripts/[^\s]+\.py)', text)
          if not scripts:
              raise SystemExit('Nenhum patch da base v18 encontrado')
          if scripts[-1] != 'scripts/patch_v19_text_read_more_strict_v18.py':
              raise SystemExit('Base v18 inesperada: ultimo patch='+scripts[-1])
          for script in scripts:
              print('>>>', script, flush=True)
              subprocess.run(['python3', script], check=True)
          print('Base v18 reproduzida com', len(scripts), 'patches')
          PY

      - name: Esperar no real Ler mais sem gestos v20
        run: python3 scripts/patch_v19_text_read_more_desc_wait_v20.py

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RotaRapida-APK-v0.19-TEXT-v20-READ-MORE-DESC-WAIT-IMAGE-v9
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
